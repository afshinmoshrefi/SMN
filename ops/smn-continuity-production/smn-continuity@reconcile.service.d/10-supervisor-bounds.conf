[Unit]
# Normal successful minute starts must never consume failure retry capacity.
# The guard records at most three failed child attempts in a rolling hour.
StartLimitIntervalSec=0

[Service]
# The independent recovery/mail-reconciliation worker cannot hang for six hours.
# The minute timer is the only restart source. An interrupted reservation counts
# as failure before another child runs; uncertain effects remain journaled.
TimeoutStartSec=90s
Restart=no
KillMode=control-group
ExecStart=
ExecStart=/home/flask/venv/bin/python /opt/smn-subscription/current/blog/reconcile_tick_guard.py --enable-production-continuity
