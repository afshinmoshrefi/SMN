<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>{% block title %}Reader access{% endblock %} | Seasonal Market News</title>
<style>
:root{color-scheme:light;--ink:#172c38;--muted:#536670;--line:#d9e2e3;--teal:#096962}
*{box-sizing:border-box}body{margin:0;background:#f8faf9;color:var(--ink);font:18px/1.65 system-ui,sans-serif}
a{color:var(--teal);text-underline-offset:3px}header{background:#132e37;color:#fff;padding:20px 5vw}
nav{max-width:1040px;margin:auto;display:flex;justify-content:space-between;gap:20px;align-items:center}nav a{color:#fff;text-decoration:none}.brand{font-weight:750;letter-spacing:-.025em}.tagline{display:block;font:10px/1.6 system-ui;letter-spacing:.2em;color:#b4c7ca}
main{max-width:780px;margin:48px auto;padding:0 26px 60px}h1{font:600 clamp(30px,5vw,48px)/1.13 Georgia,serif;letter-spacing:-.025em;margin:12px 0 26px}h2{font:600 28px/1.3 Georgia,serif;margin:0 0 12px}
.eyebrow{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.16em;color:var(--teal)}.hero{display:block;width:100%;max-height:340px;object-fit:cover;margin:28px 0;border-radius:4px}.qualification,.small{font-size:14px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin:28px 0}.invitation{border-top:3px solid var(--teal);box-shadow:0 -24px 45px 8px #f8faf9;position:relative;margin-top:42px}.invitation p{margin:10px 0 22px}.button,button{display:inline-block;border:0;border-radius:6px;background:var(--teal);color:white;padding:13px 19px;text-decoration:none;font:650 16px/1.4 system-ui;cursor:pointer}button.secondary{background:#eaf0ef;color:var(--ink)}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.notice{padding:14px 18px;background:#fff1db;border-radius:6px}.plan{margin:18px 0;padding-bottom:18px;border-bottom:1px solid var(--line)}footer{border-top:1px solid var(--line);padding:24px;text-align:center;font-size:12px;color:var(--muted)}ul{padding-left:22px}li{margin-bottom:16px}@media(max-width:500px){main{margin-top:30px;padding-inline:20px}.card{padding:22px}nav{align-items:flex-start}.brand{font-size:16px}}
</style></head><body><header><nav><a class="brand" href="/">Seasonal Market News<span class="tagline">MARKETS IN CONTEXT</span></a><div><a href="/briefings/">Market Briefing</a> · <a href="/member/account">Account</a></div></nav></header>
<main>{% block content %}{% endblock %}</main><footer>Seasonal Market News · Research and context, with historical limitations in view.</footer></body></html>
